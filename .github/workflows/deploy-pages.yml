name: Deploy proposal site to GitHub Pages

on:
  push:
    branches: ["claude/blissful-curie-fcB5F"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (and enable) GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage site files
        run: |
          mkdir -p _site
          cp -r index.html kca-logo.svg kca-assets .nojekyll _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
